name: mealplanner

services:
  mealplanner-web:
    image: mealplanner-web:local
    container_name: MealPlanner.Web
    build:
      context: .
      dockerfile: src/MealPlanner.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
    ports:
      - "5080:8080"
    depends_on:
      - mealplanner-db
 
  mealplanner-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: MealPlanner.Db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=1234512345Aa$  
    ports:
      - "1433:1433"
    volumes:
      - mealplanner_db:/var/opt/mssql

volumes:
  mealplanner_db: 
