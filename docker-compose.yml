name: mealplanner

services:
  mealplanner-web:
    image: mealplanner-web:local
    container_name: MealPlanner.Web
    build:
      context: .
      dockerfile: src/MealPlanner.Web/Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings:Database=Server=mealplanner-db;Database=MealPlanner;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      - Seed:AdministratorPassword=${SEED_ADMIN_PASSWORD}
    ports:
      - "5080:8080"
    depends_on:
      mealplanner-db:
        condition: service_healthy
    restart: unless-stopped
 
  mealplanner-db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: MealPlanner.Db
    environment:
      - ACCEPT_EULA=Y
      - MSSQL_PID=Express
      - MSSQL_SA_PASSWORD=${MSSQL_SA_PASSWORD}  
    ports:
      - "1433:1433"
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    volumes:
      - mealplanner_db:/var/opt/mssql

volumes:
  mealplanner_db: 
